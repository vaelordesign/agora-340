<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agora 340</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<style>
:root{
  --bg:#F7F7F4; --surface:#FFFFFF; --ink:#1A222E; --ink-2:#3B4552; --muted:#6A7482;
  --line:#DADFE5; --line-2:#ECEFF2;
  --accent:#24508E; --accent-ink:#FFFFFF; --accent-soft:#E7EEF8; --accent-line:#B9CBE6;
  --warm:#9E6410; --warm-soft:#F7EEDB; --warm-line:#E4CFA2;
  --good:#2B7A4B; --good-soft:#E2F1E7; --bad:#B0382F; --bad-soft:#F9E4E1;
  --shadow:0 1px 2px rgba(20,30,45,.05),0 10px 28px rgba(20,30,45,.07);
  --f-display:"GFS Didot","Didot","Bodoni MT",Georgia,serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12161C; --surface:#1A2029; --ink:#E9ECF0; --ink-2:#C6CCD4; --muted:#909AA7;
    --line:#2B3440; --line-2:#222A34;
    --accent:#8DB4EC; --accent-ink:#0E1A2C; --accent-soft:#1E2C42; --accent-line:#33507A;
    --warm:#E3AC52; --warm-soft:#33291A; --warm-line:#5A4622;
    --good:#72C08D; --good-soft:#1B2F23; --bad:#F0918A; --bad-soft:#3B2321;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12161C; --surface:#1A2029; --ink:#E9ECF0; --ink-2:#C6CCD4; --muted:#909AA7;
  --line:#2B3440; --line-2:#222A34;
  --accent:#8DB4EC; --accent-ink:#0E1A2C; --accent-soft:#1E2C42; --accent-line:#33507A;
  --warm:#E3AC52; --warm-soft:#33291A; --warm-line:#5A4622;
  --good:#72C08D; --good-soft:#1B2F23; --bad:#F0918A; --bad-soft:#3B2321;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;font-variant-numeric:oldstyle-nums}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:400;line-height:1.12;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0 0 .9em}
ul,ol{margin:0 0 1em;padding-left:1.35em}
li{margin:.25em 0}
li::marker{color:var(--muted)}
strong{font-weight:600}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.ui{font-family:var(--f-ui)}
.eyebrow{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden,[hidden]{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1220px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand h1{font-size:26px;letter-spacing:.01em}
.brand .sub{font-family:var(--f-ui);font-size:12px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.tabs{display:flex;gap:4px;margin-left:auto;font-family:var(--f-ui);flex-wrap:wrap}
.tab{border:1px solid transparent;background:transparent;padding:7px 13px;border-radius:6px;font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer}
.tab:hover{background:var(--line-2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab .n{display:inline-block;margin-left:6px;font-size:11px;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.22)}
.tab:not([aria-selected="true"]) .n{background:var(--line-2);color:var(--muted)}

/* ---------- fiches layout ---------- */
.view{display:none}
.view.on{display:block}
.wrap{max-width:1220px;margin:0 auto;padding:26px 20px 80px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:48px;align-items:start}
.toc{position:sticky;top:66px;max-height:calc(100vh - 80px);overflow:auto;font-family:var(--f-ui);font-size:13.5px;padding-right:6px;scrollbar-width:thin}
.toc .part{margin:14px 0 6px;color:var(--muted);font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.toc a{display:flex;align-items:baseline;gap:8px;color:var(--ink-2);text-decoration:none;padding:5px 8px;border-radius:5px;line-height:1.3}
.toc a:hover{background:var(--line-2)}
.toc a.cur{background:var(--accent-soft);color:var(--accent);font-weight:500}
.toc a .num{color:var(--muted);font-size:11px;min-width:18px;font-variant-numeric:tabular-nums}
.toc a.done .num{color:var(--good)}
.toc a.done .num::after{content:" ✓"}
.toc-progress{margin:10px 8px 0;font-size:12px;color:var(--muted)}
.toc-progress .bar{height:4px;background:var(--line-2);border-radius:2px;margin-top:6px;overflow:hidden}
.toc-progress .bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.btn.toc-btn{display:none}
.article{min-width:0;max-width:74ch}
.fiche{padding:44px 0 36px;border-top:1px solid var(--line)}
.fiche:first-child{border-top:0;padding-top:8px}
.fiche h2{font-size:36px;margin:6px 0 18px}
.fiche h3{font-size:22px;margin:30px 0 10px;color:var(--ink)}
.fiche h4{font-family:var(--f-ui);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:22px 0 8px}
.fiche p,.fiche li{max-width:70ch}
.lead{font-size:19px;color:var(--ink-2);line-height:1.5}
.sec-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;font-family:var(--f-ui)}
.btn{font-family:var(--f-ui);font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:7px;cursor:pointer;line-height:1.2;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 10px;font-size:13px}

/* ---------- content blocks ---------- */
.def,.retenir,.piege,.compl,.note{margin:16px 0 20px;padding:14px 18px 12px;border-radius:6px;max-width:70ch}
.def{background:var(--surface);border:1px solid var(--line)}
.retenir{background:var(--accent-soft);border:1px solid var(--accent-line)}
.piege{background:var(--warm-soft);border:1px solid var(--warm-line)}
.compl{background:transparent;border:1px dashed var(--line);color:var(--ink-2)}
.note{background:var(--line-2)}
.blabel{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;margin:0 0 6px;display:block}
.def .blabel{color:var(--accent)}
.retenir .blabel{color:var(--accent)}
.piege .blabel{color:var(--warm)}
.compl .blabel,.note .blabel{color:var(--muted)}
.def p:last-child,.retenir p:last-child,.piege p:last-child,.compl p:last-child,.note p:last-child,.def ul:last-child,.retenir ul:last-child,.piege ul:last-child,.compl ul:last-child,.note ol:last-child,.note ul:last-child,.retenir ol:last-child{margin-bottom:0}
.def .term{font-family:var(--f-display);font-size:22px;display:block;margin-bottom:4px}
blockquote.cit{margin:18px 0 20px;padding:0 0 0 22px;border-left:2px solid var(--accent-line);font-style:italic;font-size:18px;color:var(--ink);max-width:66ch}
blockquote.cit cite{display:block;font-style:normal;font-family:var(--f-ui);font-size:12.5px;color:var(--muted);margin-top:6px;letter-spacing:.02em}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:12px 0 18px;font-size:16px}
.kv dt{font-family:var(--f-ui);font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding-top:3px}
.kv dd{margin:0}
.tbl-wrap{overflow-x:auto;margin:14px 0 22px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:15.5px;min-width:480px}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink-2)}
th.m,td.m{color:var(--warm)} th.r,td.r{color:var(--accent)}
td.m,td.r{font-weight:500}
tr.hd td{background:var(--line-2);font-family:var(--f-ui);font-weight:600;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 20px}
.two .col{border:1px solid var(--line);border-radius:6px;padding:12px 16px;background:var(--surface)}
.two .col h5{margin:0 0 8px;font-family:var(--f-ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.two .col.m h5{color:var(--warm)} .two .col.r h5{color:var(--accent)}
.two ul{margin:0;padding-left:1.1em;font-size:15.5px}
.persons{display:grid;grid-template-columns:1fr;gap:14px;margin:16px 0 22px}
.person{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:16px 20px 14px}
.person .ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.person .ph h3{margin:0;font-size:26px}
.person .dates{font-family:var(--f-ui);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-family:var(--f-ui);font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin:2px 0 8px}
.pill.w{background:var(--warm-soft);color:var(--warm)}
.person ul{margin:6px 0 0;font-size:15.5px}
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0 20px;max-width:70ch}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 44px;border-bottom:1px solid var(--line-2)}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--f-ui);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
.steps li b{font-weight:600}
.tl{list-style:none;padding:0;margin:12px 0 20px}
.tl li{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.tl .d{font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;padding-top:3px}
.chk{list-style:none;padding:0;margin:10px 0 0;columns:2;column-gap:28px;font-family:var(--f-ui);font-size:14px}
.chk li{break-inside:avoid;margin:0 0 6px}
.chk a{color:var(--ink-2);text-decoration:none;display:flex;gap:8px;align-items:baseline}
.chk a:hover{color:var(--accent)}
.chk a .box{width:14px;height:14px;border:1.5px solid var(--muted);border-radius:3px;flex:none;position:relative;top:2px}
.chk a.done .box{background:var(--good);border-color:var(--good)}
.chk a.done{color:var(--muted);text-decoration:line-through}
.modal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0 6px;font-family:var(--f-ui);font-size:14px}
.modal div{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface)}
.modal b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.grid-quotes{display:grid;grid-template-columns:1fr;gap:10px;margin:12px 0 20px}
.q-item{border:1px solid var(--line);border-radius:6px;padding:10px 14px;background:var(--surface);font-size:15.5px}
.q-item i{display:block;font-style:italic}
.q-item small{font-family:var(--f-ui);color:var(--muted);font-size:12.5px}
.dates-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:12px 0 20px;font-family:var(--f-ui);font-size:14px}
.dates-grid div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface)}
.dates-grid b{font-variant-numeric:tabular-nums;color:var(--accent);display:block;font-size:13px}

/* ---------- quiz ---------- */
.qwrap{max-width:780px;margin:0 auto;padding:28px 20px 90px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 26px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.card h2{font-size:30px;margin-bottom:6px}
.card .lead{margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.chip{font-family:var(--f-ui);font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);padding:6px 12px;border-radius:999px;cursor:pointer;user-select:none}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip .cnt{color:var(--muted);font-weight:400;margin-left:4px}
.field{margin:8px 0 14px;font-family:var(--f-ui);font-size:14px}
.field label{display:block;font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{width:100%;min-height:110px;font-family:var(--f-body);font-size:16px;line-height:1.5;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.progress{height:5px;background:var(--line-2);border-radius:3px;overflow:hidden;margin:0 0 18px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:10px}
.qtype{font-family:var(--f-ui);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--line-2);color:var(--ink-2)}
.qtext{font-size:21px;line-height:1.4;margin:6px 0 18px;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{font-family:var(--f-ui);font-size:15.5px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 14px 11px 44px;cursor:pointer;position:relative;line-height:1.35}
.opt .k{position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.ko{border-color:var(--bad);background:var(--bad-soft)}
.opt.ko .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fb{margin-top:16px;padding:14px 16px;border-radius:8px;font-size:15.5px;border:1px solid var(--line)}
.fb.ok{background:var(--good-soft);border-color:var(--good)} .fb.ko{background:var(--bad-soft);border-color:var(--bad)}
.fb .blabel{margin-bottom:4px}
.fb.ok .blabel{color:var(--good)} .fb.ko .blabel{color:var(--bad)}
.fb p:last-child{margin-bottom:0}
.model{margin-top:14px;padding:14px 16px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--accent-line);font-size:15.5px}
.model .blabel{color:var(--accent)}
.model ul,.model ol{margin-bottom:0}
.model p:last-child{margin-bottom:0}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kw span{font-family:var(--f-ui);font-size:12.5px;padding:2px 8px;border-radius:4px;background:var(--surface);border:1px solid var(--accent-line);color:var(--accent)}
.grade{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;font-family:var(--f-ui)}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.score{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0 18px}
.score div{flex:1;min-width:130px;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--f-ui)}
.score b{display:block;font-size:30px;font-family:var(--f-display);font-weight:400;font-variant-numeric:tabular-nums;line-height:1.1}
.score small{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.bygroup{list-style:none;padding:0;margin:0 0 18px;font-family:var(--f-ui);font-size:14px}
.bygroup li{display:grid;grid-template-columns:1fr 60px 120px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line-2)}
.bygroup .bar{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden}
.bygroup .bar i{display:block;height:100%;background:var(--accent)}
.missed{list-style:none;padding:0;margin:0}
.missed li{padding:10px 0;border-bottom:1px solid var(--line-2);font-size:15px}
.missed li a{font-family:var(--f-ui);font-size:13px;margin-left:8px;white-space:nowrap}
.timer{font-family:var(--f-ui);font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:6px}
.timer.low{color:var(--bad);border-color:var(--bad)}
.exam-map{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 16px}
.exam-map button{width:30px;height:30px;border-radius:5px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-ui);font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
.exam-map button.ans{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.exam-map button.cur{outline:2px solid var(--accent)}
.corr{border-top:1px solid var(--line);padding:16px 0}
.corr .qtext{font-size:17px;margin:4px 0 8px}
.corr .you{font-family:var(--f-ui);font-size:14px;margin:4px 0}
.corr .you b{font-weight:600}
.corr .you.ok{color:var(--good)} .corr .you.ko{color:var(--bad)}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-align:center}
.flash .side{font-size:20px;line-height:1.4}
.flash .back{font-size:16px;text-align:left}
.flash .hint{font-family:var(--f-ui);font-size:12.5px;color:var(--muted);margin-top:14px;letter-spacing:.04em}
.stat-line{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin-top:10px}
.empty{color:var(--muted);font-style:italic}

/* ---------- express ---------- */
.xwrap{max-width:860px;margin:0 auto;padding:26px 20px 90px}
.xhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.xhead h2{font-size:40px;margin-top:6px}
.xwrap .lead{max-width:70ch}
.xplan{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0 8px;font-family:var(--f-ui);font-size:13px}
.xplan a{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface);color:var(--ink-2);text-decoration:none;line-height:1.3}
.xplan a:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.xplan b{display:block;color:var(--accent);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.xblock{border-top:1px solid var(--line);padding:30px 0 12px;margin-top:22px;scroll-margin-top:72px}
.xblock h3{font-size:28px;margin:0 0 4px}
.xblock h4{font-family:var(--f-ui);font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);margin:26px 0 8px}
